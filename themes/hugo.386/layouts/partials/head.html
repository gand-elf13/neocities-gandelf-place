<head>
    <title>{{ .Site.Title }}</title>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
{{ with .OutputFormats.Get "rss" }}
  {{ printf `<link rel=%q type=%q href=%q title=%q>` .Rel .MediaType.Type .Permalink site.Title | safeHTML }}
{{ end }}
    <meta content="utf-8" http-equiv="encoding">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#000084" />
    <link rel="icon" type="image/x-icon" href="{{ .Site.BaseURL }}/favicon.ico">
    <link rel="canonical" href="{{ .Site.BaseURL }}">
    {{/* Don't ask why it's like this. This original theme is a mess... */}}

    <noscript>
      <style>
        body { 
          visibility: visible !important; 
        }
        /* Hide the mobile menu toggle button since we can't toggle without JS */
        .btn-navbar { 
          display: none !important; 
        }
        /* Make the collapsed nav visible on mobile */
        .nav-collapse, 
        .nav-collapse.collapse {
          height: auto !important;
          overflow: visible !important;
        }
        /* Show dropdown menus by default (they won't be collapsible) */
        .nav-collapse .dropdown-menu {
          display: block !important;
          position: static !important;
          float: none !important;
          max-width: none !important;
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
          padding: 8px 0 12px 30px !important;
          margin: 6px 0 14px 0 !important;
        }
        /* Make dropdown toggle links look normal */
        .nav-collapse .dropdown-toggle .caret {
          display: none !important;
        }
        /* Push content down more to account for expanded fixed navbar */
        #content.container {
          padding-top: 110px !important;
        }
      </style>
    </noscript>
  {{ if .Params.extra_js }}
    <script src="{{ .Params.extra_js }}" defer></script>
  {{ end }}
</head>
