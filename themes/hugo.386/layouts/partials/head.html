<head>
    <title>{{ .Site.Title }}</title>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
{{ with .OutputFormats.Get "rss" }}
  {{ printf `<link rel=%q type=%q href=%q title=%q>` .Rel .MediaType.Type .Permalink site.Title | safeHTML }}
{{ end }}
    <meta content="utf-8" http-equiv="encoding">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#000084" />
    <link rel="icon" type="image/x-icon" href="{{ .Site.BaseURL }}/favicon.ico">
    <link rel="canonical" href="{{ .Site.BaseURL }}">
    {{/* Don't ask why it's like this. This original theme is a mess... */}}

    <noscript>
      <style>
        body { 
          visibility: visible !important; 
        }
        /* Hide the mobile menu toggle button since we can't toggle without JS */
        .btn-navbar { 
          display: none !important; 
        }
        /* Make the collapsed nav visible on mobile */
        .nav-collapse, 
        .nav-collapse.collapse {
          height: auto !important;
          overflow: visible !important;
        }
        /* Without JS the navbar cannot collapse, so let it flow with the
           page instead of overlapping the content below. */
        .navbar-fixed-top {
          position: static !important;
        }
      </style>
    </noscript>
  {{ if .Params.extra_js }}
    <script src="{{ .Params.extra_js }}" defer></script>
  {{ end }}
</head>
